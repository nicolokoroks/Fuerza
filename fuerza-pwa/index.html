<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fuerza"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#000;--card:#0f0f10;--line:#222;--tx:#f2f2f2;--mu:#8a8a8f;--red:#e5222b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:34px;margin:6px 0 14px;letter-spacing:.5px}h2{font-size:22px;margin:18px 0 8px;color:var(--mu);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;font-weight:700;font-size:20px;margin:6px 0}
.big{background:var(--red);border:0;font-size:30px;padding:34px 10px;border-radius:16px}
.sm{width:auto;padding:8px 12px;font-size:16px;margin:0}.red{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.mu{color:var(--mu);font-size:15px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
input,select,textarea{background:#000;border:1px solid #333;border-radius:10px;padding:12px 6px;width:100%;text-align:center;font-size:22px;font-weight:700}
input[type=text],textarea{text-align:left;font-size:18px;font-weight:500;padding:12px}
textarea{height:140px;font-size:13px}
.tag{flex:0 0 40px;height:48px;border-radius:10px;border:1px solid #333;background:#000;font-weight:800}
.tag.W{color:#f5b301}.tag.D{color:#4da3ff}.tag.F{color:var(--red)}
.ok{flex:0 0 52px;height:48px;border-radius:10px;border:1px solid #333;background:#000;font-size:24px}
.ok.on{background:var(--red);border-color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;padding:14px 0;color:var(--mu);font-weight:700;font-size:15px}.nav .a{color:var(--red)}
.ov{position:fixed;inset:0;background:#000e;overflow:auto;padding:16px;z-index:9}.ov>div{max-width:560px;margin:auto}
.chk{display:flex;gap:6px;flex-wrap:wrap}.chk label{border:1px solid #333;border-radius:10px;padding:8px 12px}
svg{width:100%;height:auto}
body{background:radial-gradient(700px 320px at 0 0,#e5222b26,transparent 70%) fixed no-repeat #000}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}

</style></head><body><div id="app"></div><div class="nav" id="nav"></div><div id="ovl"></div><div id="dlg"></div>
<script>
const LIB=`Sentadilla trasera|Piernas|Barra;Sentadilla frontal|Piernas|Barra;Prensa de piernas|Piernas|Máquina;Peso muerto|Espalda|Barra;Peso muerto rumano|Isquios|Barra;Hip thrust|Glúteos|Barra;Zancadas|Piernas|Mancuerna;Curl femoral|Isquios|Máquina;Extensión de cuádriceps|Cuádriceps|Máquina;Elevación de talones|Gemelos|Máquina;Press de banca|Pecho|Barra;Press banca inclinado|Pecho|Barra;Press con mancuernas|Pecho|Mancuerna;Aperturas en polea|Pecho|Polea;Fondos|Pecho|Corporal;Press militar|Hombro|Barra;Press hombro mancuernas|Hombro|Mancuerna;Elevaciones laterales|Hombro|Mancuerna;Pájaros|Hombro|Mancuerna;Dominadas|Espalda|Corporal;Jalón al pecho|Espalda|Polea;Remo con barra|Espalda|Barra;Remo con mancuerna|Espalda|Mancuerna;Remo en polea|Espalda|Polea;Face pull|Hombro|Polea;Curl de bíceps barra|Bíceps|Barra;Curl martillo|Bíceps|Mancuerna;Extensión tríceps polea|Tríceps|Polea;Press francés|Tríceps|Barra;Fondos en banco|Tríceps|Corporal;Plancha|Core|Corporal;Crunch en polea|Core|Polea;Elevación de piernas|Core|Corporal`.split(';').map((s,i)=>{const[a,b,c]=s.split('|');return{id:'l'+i,n:a,m:b,e:c}});
let S={ex:[],tpl:[],hist:[],act:null,set:{unit:'kg',bar:20,plates:[25,20,15,10,5,2.5,1.25]}};
try{const x=JSON.parse(localStorage.getItem('fz'));if(x)S=Object.assign(S,x)}catch(e){}
let noSave=false;const save=()=>{try{localStorage.setItem('fz',JSON.stringify(S))}catch(e){noSave=true}};save();
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const all=()=>LIB.concat(S.ex),X=id=>all().find(e=>e.id==id)||{n:'(borrado)',m:'',e:''};
const U=()=>S.set.unit,toD=k=>k===''||k==null?'':(U()=='kg'?k:Math.round(k*2.20462*100)/100),toK=v=>v===''?'':Math.round((U()=='kg'?+v:v/2.20462)*1000)/1000;
const fmt=k=>(+toD(k)).toString()+' '+U();
let V='home',tmp={name:'',ex:[]},pr={ex:'',r:'1m'};
function last(id){for(let i=S.hist.length-1;i>=0;i--){const e=S.hist[i].ex.find(x=>x.id==id);if(e)return{d:S.hist[i].date,s:e.sets}}return null}
function newSets(id){const l=last(id);if(l&&l.s.length)return l.s.map(s=>({t:s.t=='W'?'W':'N',w:s.w,r:s.r,q:'',d:false}));return[0,1,2].map(()=>({t:'N',w:'',r:'',q:'',d:false}))}
function start(ids,name){S.act={name:name||'Entreno libre',start:Date.now(),ex:ids.map(id=>({id,sets:newSets(id)}))};save();go('wk')}
let stk=[];
function go(v){if(v=='home')stk=[];else if(v!==V){stk.push(V);try{history.pushState(0,'')}catch(e){}}V=v;render()}
function back(){V=stk.pop()||'home';render()}
addEventListener('popstate',()=>{if(stk.length){V=stk.pop();render()}});
function dlg(m,y,l){const d=$('#dlg');d.innerHTML=`<div class="ov" style="z-index:20;display:flex;align-items:center"><div class="card" style="width:100%;padding:18px"><div style="font-size:22px;margin-bottom:12px">${esc(m)}</div><div class="row">${y?'<button class="btn" id="dn">Cancelar</button>':''}<button class="btn big" id="dy" style="font-size:20px;padding:14px">${l||'Entendido'}</button></div></div></div>`;const c=()=>{d.innerHTML=''};if(y)$('#dn').onclick=c;$('#dy').onclick=()=>{c();y&&y()}}
function nav(){const n=[['home','Inicio'],['tpl','Rutinas'],['tools','Discos/1RM'],['prog','Progreso'],['set','Ajustes']];$('#nav').innerHTML=n.map(([k,l])=>`<button class="${V==k||(V=='wk'&&k=='home')?'a':''}" onclick="go('${k}')">${l}</button>`).join('')}
function render(){nav();const f={home,wk,tpl,tools,prog,set}[V],b=f();$('#app').innerHTML=(V!='home'?'<div class="top"><button class="back" onclick="back()" aria-label="Atrás">←</button></div>':'')+b+'<div class="foot">made by Nicolas Ramirez</div>'}
function home(){let h='<h1>FUERZA</h1>';
if(noSave)h+='<div class="warn">Este navegador no permite guardar datos aquí: lo que registres se perderá al cerrar. Abre la app desde un enlace web o exporta backups.</div>';
else if(location.protocol=='file:')h+='<div class="warn">Estás usando la app desde un archivo local. Algunos móviles borran sus datos al cerrarlo: exporta un backup en Ajustes de vez en cuando.</div>';
if(S.act)h+=`<button class="btn big" onclick="go('wk')">Reanudar sesión<div class="mu" style="color:#fff9;font-size:16px">${esc(S.act.name)}</div></button>`;
else h+=`<button class="btn big" onclick="start([],'Entreno libre')">Empezar entrenamiento</button>`;
h+='<h2>Últimas rutinas</h2>';
const seen=[];S.hist.slice().reverse().forEach(x=>{if(x.tid&&!seen.includes(x.tid)&&S.tpl.find(t=>t.id==x.tid))seen.push(x.tid)});
const ts=seen.slice(0,4).map(id=>S.tpl.find(t=>t.id==id)).concat(S.tpl.filter(t=>!seen.includes(t.id))).slice(0,5);
h+=ts.length?ts.map(t=>`<button class="btn" onclick="startT('${t.id}')">${esc(t.name)} <span class="mu">· ${t.ex.length} ejercicios</span></button>`).join(''):'<p class="mu">Crea una rutina en la pestaña Rutinas para repetirla con un toque.</p>';
const l=S.hist[S.hist.length-1];if(l)h+=`<h2>Última sesión</h2><div class="card">${esc(l.name)}<div class="mu">${new Date(l.date).toLocaleDateString()} · Volumen ${fmt(l.vol)}</div></div>`;
return h}
function startT(id){const t=S.tpl.find(x=>x.id==id);start(t.ex,t.name);S.act.tid=id;save()}
function wk(){const a=S.act;if(!a){V='home';return home()}
let h=`<h1>${esc(a.name)}</h1>`;
a.ex.forEach((e,ei)=>{const l=last(e.id),x=X(e.id);
h+=`<div class="card"><div class="row"><b style="flex:3;font-size:22px">${esc(x.n)}</b><button class="btn sm red" onclick="rmEx(${ei})">Quitar</button></div>
<div class="mu">${l?'Anterior ('+new Date(l.d).toLocaleDateString()+'): '+l.s.map(s=>(s.t=='W'?'W ':'')+toD(s.w)+'×'+s.r).join(' · '):'Sin registros previos'}</div>
<div class="row mu" style="margin-top:8px"><span style="flex:0 0 40px">Tipo</span><span>${U()}</span><span>Reps</span><span>RIR</span><span style="flex:0 0 52px"></span></div>`;
e.sets.forEach((s,si)=>{h+=`<div class="row" style="margin:6px 0"><button class="tag ${s.t}" onclick="tg(${ei},${si})">${s.t=='N'?si+1:s.t}</button>
<input type="number" inputmode="decimal" step="0.25" value="${toD(s.w)}" onchange="up(${ei},${si},'w',this.value)">
<input type="number" inputmode="numeric" value="${s.r}" onchange="up(${ei},${si},'r',this.value)">
<select onchange="up(${ei},${si},'q',this.value)">${['','0','1','2','3','4','5'].map(o=>`<option ${o==s.q?'selected':''}>${o||'–'}</option>`).join('')}</select>
<button class="ok ${s.d?'on':''}" onclick="ck(${ei},${si})">✓</button></div>`});
h+=`<div class="row"><button class="btn sm" onclick="addSet(${ei})">+ Serie</button><button class="btn sm" onclick="delSet(${ei})">− Serie</button></div></div>`});
h+=`<button class="btn" onclick="pick(id=>{S.act.ex.push({id,sets:newSets(id)});save();render()})">+ Añadir ejercicio</button>
<button class="btn big" style="font-size:24px;padding:20px" onclick="fin()">Terminar sesión</button>
<button class="btn red" onclick="dlg('¿Descartar la sesión? Se perderán las series de este entreno.',()=>{S.act=null;save();go('home')},'Descartar')">Descartar</button>
<p class="mu">Tipo: toca para alternar Normal → W calentamiento → D drop set → F fallo. W no cuenta en volumen ni 1RM.</p>`;return h}
const up=(e,s,k,v)=>{const o=S.act.ex[e].sets[s];o[k]=k=='w'?toK(v):(k=='q'?(v=='–'?'':v):v);save()};
const tg=(e,s)=>{const o=S.act.ex[e].sets[s];o.t={N:'W',W:'D',D:'F',F:'N'}[o.t];save();render()};
const ck=(e,s)=>{const o=S.act.ex[e].sets[s];o.d=!o.d;save();render()};
const addSet=e=>{const ss=S.act.ex[e].sets,l=ss[ss.length-1]||{};ss.push({t:'N',w:l.w??'',r:l.r??'',q:'',d:false});save();render()};
const delSet=e=>{S.act.ex[e].sets.pop();save();render()};
const rmEx=e=>{S.act.ex.splice(e,1);save();render()};
function fin(){const a=S.act;let vol=0,rm={};const ex=[];
a.ex.forEach(e=>{const ss=e.sets.filter(s=>s.d&&+s.w>=0&&+s.r>0).map(s=>({t:s.t,w:+s.w||0,r:+s.r,q:s.q}));if(!ss.length)return;ex.push({id:e.id,sets:ss});
let best=null;ss.forEach(s=>{if(s.t!='W'){vol+=s.w*s.r;if(s.r>1&&(!best||s.w>best.w))best=s}});if(best)rm[e.id]=Math.round(best.w*(1+0.0333*best.r)*10)/10});
if(!ex.length){dlg('Marca al menos una serie con ✓ para guardar.');return}
S.hist.push({id:'h'+Date.now(),date:Date.now(),name:a.name,tid:a.tid,ex,vol:Math.round(vol),rm});S.act=null;save();go('home')}
function pick(cb){const o=$('#ovl');let q='';
const draw=()=>{const l=all().filter(e=>(e.n+e.m+e.e).toLowerCase().includes(q.toLowerCase()));
o.innerHTML=`<div class="ov"><div><input type="text" id="q" placeholder="Buscar ejercicio" value="${esc(q)}">
${l.map(e=>`<button class="btn" data-id="${e.id}" style="text-align:left">${esc(e.n)} <span class="mu">${esc(e.m)} · ${esc(e.e)}</span></button>`).join('')}
<h2>Crear ejercicio</h2><input type="text" id="cn" placeholder="Nombre"><input type="text" id="cm" placeholder="Músculo principal" style="margin-top:6px">
<select id="ce" style="margin:6px 0">${['Barra','Mancuerna','Máquina','Polea','Corporal'].map(x=>`<option>${x}</option>`).join('')}</select>
<button class="btn" id="cc">Guardar y añadir</button><button class="btn" id="cx">Cerrar</button></div></div>`;
const qi=$('#q');qi.oninput=()=>{q=qi.value;draw();$('#q').focus();$('#q').setSelectionRange(q.length,q.length)};
o.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{o.innerHTML='';cb(b.dataset.id)});
$('#cx').onclick=()=>o.innerHTML='';
$('#cc').onclick=()=>{const n=$('#cn').value.trim();if(!n)return dlg('Escribe un nombre.');const e={id:'c'+Date.now(),n,m:$('#cm').value.trim()||'—',e:$('#ce').value};S.ex.push(e);save();o.innerHTML='';cb(e.id)}};draw()}
function tpl(){let h='<h1>Rutinas</h1>';
h+=S.tpl.map(t=>`<div class="card"><b style="font-size:22px">${esc(t.name)}</b><div class="mu">${t.ex.map(i=>esc(X(i).n)).join(', ')}</div>
<div class="row" style="margin-top:8px"><button class="btn sm" onclick="startT('${t.id}')">Empezar</button><button class="btn sm" onclick="expT('${t.id}')">Exportar</button><button class="btn sm red" onclick="delT('${t.id}')">Borrar</button></div></div>`).join('')||'<p class="mu">Aún no tienes rutinas.</p>';
h+=`<h2>Nueva rutina</h2><input type="text" id="tn" placeholder="Nombre (ej. Push)" value="${esc(tmp.name)}" oninput="tmp.name=this.value">
<div class="mu" style="margin:8px 0">${tmp.ex.map((i,k)=>`<div class="row"><span style="flex:4">${esc(X(i).n)}</span><button class="btn sm red" onclick="tmp.ex.splice(${k},1);render()">×</button></div>`).join('')||'Sin ejercicios'}</div>
<button class="btn" onclick="pick(id=>{tmp.ex.push(id);render()})">+ Añadir ejercicio</button>
<button class="btn big" style="font-size:22px;padding:16px" onclick="saveT()">Guardar rutina</button>`;return h}
function saveT(){if(!tmp.name.trim()||!tmp.ex.length)return dlg('Pon un nombre y al menos un ejercicio.');S.tpl.push({id:'t'+Date.now(),name:tmp.name.trim(),ex:tmp.ex});tmp={name:'',ex:[]};save();render()}
function delT(id){dlg('¿Borrar rutina?',()=>{S.tpl=S.tpl.filter(t=>t.id!=id);save();render()},'Borrar')}
function plates(w){const side=(w-S.set.bar)/2;if(side<0)return null;let r=side,out=[];S.set.plates.slice().sort((a,b)=>b-a).forEach(p=>{const n=Math.floor((r+1e-9)/p);if(n){out.push([p,n]);r-=n*p}});return{out,real:Math.round((w-2*r)*100)/100}}
function tools(){return`<h1>Herramientas</h1><div class="card"><b>Calculadora de discos</b><input type="number" inputmode="decimal" id="pw" placeholder="Peso total (kg)" oninput="calcP()" style="margin:8px 0"><div id="pr" class="mu">Barra de ${S.set.bar} kg. Discos configurables en Ajustes.</div></div>
<div class="card"><b>Calculadora de 1RM (Epley)</b><div class="row" style="margin:8px 0"><input type="number" inputmode="decimal" id="rw" placeholder="Peso" oninput="calcR()"><input type="number" inputmode="numeric" id="rr" placeholder="Reps" oninput="calcR()"></div><div id="rres" class="mu"></div></div>`}
function calcP(){const w=+$('#pw').value,el=$('#pr');if(!w)return el.textContent='';const p=plates(w);if(!p)return el.textContent='Menos que la barra.';
el.innerHTML=`<div style="font-size:24px;color:#fff;margin:6px 0">Por lado: ${p.out.map(([d,n])=>n+'×'+d).join(' + ')||'solo barra'}</div>`+(Math.abs(p.real-w)>.01?`<span class="red">No se puede formar ${w} kg con tus discos. Peso simétrico más cercano: ${p.real} kg.</span>`:'Peso exacto.')}
function calcR(){const w=+$('#rw').value,r=+$('#rr').value;$('#rres').innerHTML=w&&r?`<span style="font-size:30px;color:#fff">${(w*(1+0.0333*r)).toFixed(1)}</span> (1RM estimado)`:''}
function prog(){const ids=[...new Set(S.hist.flatMap(h=>Object.keys(h.rm)))];if(!pr.ex||!ids.includes(pr.ex))pr.ex=ids[0]||'';
const lim={'1m':30,'3m':90,all:1e5}[pr.r]*864e5,f=h=>Date.now()-h.date<=lim;
let h='<h1>Progreso</h1><div class="row">'+[['1m','1 mes'],['3m','3 meses'],['all','Todo']].map(([k,l])=>`<button class="btn sm ${pr.r==k?'red':''}" onclick="pr.r='${k}';render()">${l}</button>`).join('')+'</div>';
h+=ids.length?`<select style="margin:10px 0;text-align:left;font-size:18px" onchange="pr.ex=this.value;render()">${ids.map(i=>`<option value="${i}" ${i==pr.ex?'selected':''}>${esc(X(i).n)}</option>`).join('')}</select>`:'';
const a=S.hist.filter(f).filter(x=>x.rm[pr.ex]).map(x=>[x.date,toD(x.rm[pr.ex])]),b=S.hist.filter(f).map(x=>[x.date,toD(x.vol)]);
return h+`<div class="card"><b>1RM estimado (${U()})</b>${chart(a)}</div><div class="card"><b>Volumen por sesión (${U()})</b>${chart(b)}</div>`}
function chart(p){if(p.length<1)return'<p class="mu">Sin datos en este rango.</p>';const W=320,H=140,P=24,xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs)||1,y0=Math.min(...ys),y1=Math.max(...ys);
const X_=d=>P+(x1==x0?.5:(d-x0)/(x1-x0))*(W-2*P),Y_=v=>H-P-(y1==y0?.5:(v-y0)/(y1-y0))*(H-2*P);
return`<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="#e5222b" stroke-width="2.5" points="${p.map(q=>X_(q[0])+','+Y_(q[1])).join(' ')}"/>${p.map(q=>`<circle cx="${X_(q[0])}" cy="${Y_(q[1])}" r="3.5" fill="#e5222b"><title>${new Date(q[0]).toLocaleDateString()}: ${q[1]}</title></circle>`).join('')}<text x="4" y="14" fill="#8a8a8f" font-size="11">${y1}</text><text x="4" y="${H-8}" fill="#8a8a8f" font-size="11">${y0}</text></svg>`}
function set(){return`<h1>Ajustes</h1><div class="card"><div class="row"><span>Unidad</span><select onchange="S.set.unit=this.value;save();render()"><option value="kg" ${U()=='kg'?'selected':''}>kg</option><option value="lb" ${U()=='lb'?'selected':''}>lb</option></select></div>
<div class="row" style="margin-top:8px"><span>Barra (kg)</span><input type="number" step="0.5" value="${S.set.bar}" onchange="S.set.bar=+this.value||20;save()"></div>
<div style="margin:8px 0">Discos disponibles (kg)</div><input type="text" value="${S.set.plates.join(', ')}" onchange="S.set.plates=this.value.split(/[ ,;]+/).map(Number).filter(n=>n>0);save()"></div>
<button class="btn" onclick="expB()">Exportar backup</button><button class="btn" onclick="imp('backup')">Importar backup (sobrescribe todo)</button><button class="btn" onclick="imp('routine')">Importar rutina de un amigo</button>
<p class="mu">Los datos se guardan solo en este dispositivo. Exporta un backup de vez en cuando.</p>`}
function showJ(o,name){const t=JSON.stringify(o);$('#ovl').innerHTML=`<div class="ov"><div><h2>${name}</h2><textarea id="jt" readonly>${esc(t)}</textarea>
<button class="btn" id="b1">Compartir archivo .json</button><button class="btn" id="b2">Copiar texto</button><button class="btn" onclick="$('#ovl').innerHTML=''">Cerrar</button></div></div>`;
$('#b1').onclick=async()=>{try{const f=new File([t],name+'.json',{type:'application/json'});await navigator.share({files:[f],title:name})}catch(e){dlg('Tu navegador no puede compartir archivos. Usa "Copiar texto".')}};
